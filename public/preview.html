<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixeldrain Live File Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .preview-container {
      width: 100%;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin-top: 1rem;
      position: relative;
    }

    .preview-media {
      max-width: 100%;
      max-height: 550px;
      border-radius: 8px;
    }

    video.preview-media, audio.preview-media {
      width: 100%;
      outline: none;
    }

    .preview-text {
      width: 100%;
      max-height: 450px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: #00f2fe;
      background: #060911;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .preview-pdf {
      width: 100%;
      height: 550px;
      border: none;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .back-link {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  <div class="background-grid"></div>

  <main class="app-container">
    <nav class="nav-bar">
      <a href="index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>Back to Downloader</span>
      </a>
      <span id="previewTag" class="badge">Live Stream Preview</span>
    </nav>

    <!-- Header -->
    <header class="header">
      <h1 id="previewTitle">File Preview</h1>
      <p id="previewSubtitle" class="subtitle">Direct streaming media preview from server</p>
    </header>

    <!-- Preview Box -->
    <section class="card">
      <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p>Loading media stream preview...</p>
      </div>

      <div id="errorBox" class="error-banner hidden"></div>

      <div id="previewWrapper" class="preview-container hidden">
        <!-- Media content injected dynamically -->
      </div>

      <div id="fileInfoBox" class="meta-grid hidden" style="margin-top: 1.25rem;">
        <div class="meta-item">
          <span class="meta-label">Filename</span>
          <span id="pFileName" class="meta-value">-</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Size</span>
          <span id="pFileSize" class="meta-value">-</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Type</span>
          <span id="pFileType" class="meta-value">-</span>
        </div>
      </div>

      <div id="actionBox" class="action-buttons hidden" style="margin-top: 1.25rem;">
        <a id="pDownloadBtn" href="#" download class="btn-primary btn-large">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>Download File</span>
        </a>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      let fileId = urlParams.get('id') || urlParams.get('url');

      // Extract file ID if accessed via /stream/:id route
      if (!fileId && window.location.pathname.startsWith('/stream/')) {
        fileId = window.location.pathname.replace('/stream/', '');
      }

      const loader = document.getElementById('loader');
      const errorBox = document.getElementById('errorBox');
      const previewWrapper = document.getElementById('previewWrapper');
      const previewTitle = document.getElementById('previewTitle');
      const previewSubtitle = document.getElementById('previewSubtitle');
      const pFileName = document.getElementById('pFileName');
      const pFileSize = document.getElementById('pFileSize');
      const pFileType = document.getElementById('pFileType');
      const fileInfoBox = document.getElementById('fileInfoBox');
      const actionBox = document.getElementById('actionBox');
      const pDownloadBtn = document.getElementById('pDownloadBtn');

      if (!fileId) {
        loader.classList.add('hidden');
        errorBox.textContent = 'No Pixeldrain File ID or URL provided in query. Example: preview.html?id=x82a9k1m';
        errorBox.classList.remove('hidden');
        return;
      }

      try {
        const infoRes = await fetch(`/api/info?url=${encodeURIComponent(fileId)}`);
        const data = await infoRes.json();

        loader.classList.add('hidden');

        if (!data.success) {
          errorBox.textContent = data.error || 'Failed to load file details.';
          errorBox.classList.remove('hidden');
          return;
        }

        const streamUrl = `/api/download/${data.id}`;
        const downloadUrl = `/download/${data.id}`;
        const mime = (data.mime_type || '').toLowerCase();
        const name = data.name || data.id;

        previewTitle.textContent = name;
        previewSubtitle.textContent = `Type: ${mime} | Size: ${(data.size / (1024*1024)).toFixed(2)} MB`;

        pFileName.textContent = name;
        pFileSize.textContent = (data.size / (1024*1024)).toFixed(2) + ' MB';
        pFileType.textContent = mime;

        pDownloadBtn.href = downloadUrl;
        pDownloadBtn.setAttribute('download', name);

        fileInfoBox.classList.remove('hidden');
        actionBox.classList.remove('hidden');

        // Render preview based on MIME type or extension
        if (mime.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = streamUrl;
          img.alt = name;
          img.className = 'preview-media';
          previewWrapper.appendChild(img);
        } else if (mime.startsWith('video/') || name.match(/\.(mp4|webm|mkv|mov|avi)$/i)) {
          const video = document.createElement('video');
          video.src = streamUrl;
          video.controls = true;
          video.autoplay = true;
          video.className = 'preview-media';
          previewWrapper.appendChild(video);
        } else if (mime.startsWith('audio/') || name.match(/\.(mp3|wav|ogg|flac|m4a)$/i)) {
          const audio = document.createElement('audio');
          audio.src = streamUrl;
          audio.controls = true;
          audio.autoplay = true;
          audio.className = 'preview-media';
          previewWrapper.appendChild(audio);
        } else if (mime === 'application/pdf' || name.endsWith('.pdf')) {
          const iframe = document.createElement('iframe');
          iframe.src = streamUrl;
          iframe.className = 'preview-pdf';
          previewWrapper.appendChild(iframe);
        } else if (mime.startsWith('text/') || name.match(/\.(txt|json|js|html|css|py|md|log|csv)$/i)) {
          const textRes = await fetch(streamUrl);
          const textContent = await textRes.text();
          const pre = document.createElement('pre');
          pre.className = 'preview-text';
          pre.textContent = textContent.slice(0, 50000); // limit 50KB text
          previewWrapper.appendChild(pre);
        } else {
          previewWrapper.innerHTML = `
            <div style="text-align: center; padding: 2rem; color: #94a3b8;">
              <p style="font-size: 1.1rem; margin-bottom: 8px;">No direct inline viewer for this file type.</p>
              <p style="font-size: 0.85rem;">You can download it directly using the button below.</p>
            </div>
          `;
        }

        previewWrapper.classList.remove('hidden');

      } catch (err) {
        loader.classList.add('hidden');
        errorBox.textContent = 'Error connecting to streaming server.';
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
